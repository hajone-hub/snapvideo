name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"
      - name: Giai nen
        run: for z in *.zip; do unzip -q "$z"; done
      - name: Build
        working-directory: SnapVideoAndroid
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SnapVideo-apk
          path: SnapVideoAndroid/app/build/outputs/apk/debug/app-debug.apk
